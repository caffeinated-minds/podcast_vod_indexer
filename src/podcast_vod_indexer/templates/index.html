<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>The StandUp Podcast Index</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>
    <body class="bg-body-tertiary">
        <main class="container-fluid py-4">
            <div class="mb-4">
                <h1 class="h3 mb-0">The StandUp Podcast Index</h1>
            </div>

            <div class="table-responsive border rounded bg-white shadow-sm">
                <table
                    class="table table-striped table-hover align-middle mb-0"
                >
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Episode</th>
                            <th scope="col">Episode Date</th>
                            <th scope="col">YouTube Full Episode</th>
                            <th scope="col">Spotify Full Episode</th>
                            <th scope="col">Matching VOD</th>
                            <th scope="col">VOD Date</th>
                            <th scope="col">Start Time</th>
                            <th scope="col">Timestamp Link</th>
                            <th scope="col">Confidence <br />(cutoff 15%)</th>
                        </tr>
                    </thead>
                    <tbody>
                        $rows
                    </tbody>
                </table>
            </div>
        </main>
    </body>
</html>
